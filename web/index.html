<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>통합 업무 도구</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #d9dde3;
      --accent: #2563eb;
      --accent-soft: #eff4ff;
      --ok: #15803d;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --error: #b91c1c;
      --error-soft: #fef2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 15px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav button {
      border: 1px solid var(--line);
      border-bottom: none;
      background: var(--bg);
      padding: 8px 18px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      color: var(--muted);
    }

    nav button.active {
      background: var(--panel);
      color: var(--text);
      font-weight: bold;
      position: relative;
      top: 1px;
    }

    main {
      padding: 24px;
      max-width: 960px;
    }

    section {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }

    section.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .muted {
      color: var(--muted);
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
    }

    .ok {
      color: var(--ok);
    }

    .error {
      color: var(--error);
    }

    /* 파일 놓는 곳: 안에 투명한 파일 입력 칸을 깔아서, 끌어다 놓기와 눌러서 선택이 둘 다 됨 */
    .drop {
      position: relative;
      display: block;
      border: 2px dashed var(--line);
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      margin: 16px 0;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop:hover,
    .drop.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .drop.chosen {
      border-style: solid;
      border-color: var(--accent);
      color: var(--text);
    }

    .drop input[type=file] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .drop .label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      color: var(--text);
    }

    .drop.optional {
      padding: 18px 16px;
    }

    .drops {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .drops .drop {
      margin: 16px 0 0;
    }

    .template-info {
      font-size: 13px;
      margin: 0 0 16px;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button.primary:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button.secondary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
    }

    .result .box {
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .result .warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .result .fail {
      background: var(--error-soft);
      color: var(--error);
    }

    .result ul {
      margin: 0;
      padding-left: 20px;
    }

    .result pre {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 16px;
      margin: 0 0 12px;
      white-space: pre-wrap;
      font-family: Consolas, "Malgun Gothic", monospace;
      font-size: 13px;
    }

    .result .folder {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <h1>통합 업무 도구</h1>
    <nav>
      <button data-tab="order" class="active">발주서</button>
      <button data-tab="settlement">결산서</button>
      <button data-tab="expendables">소모품</button>
      <button data-tab="vendors">거래처별</button>
      <button data-tab="settings">설정</button>
    </nav>
  </header>

  <main>
    <section id="order" class="active">
      <h2>웰스토리 발주서</h2>
      <p class="muted">웰스토리 사이트에서 받은 거래내역서(xlsx)를 올리면 사업장별 EPS 업로드 파일과 확인용 파일을 만듭니다.</p>
      <form class="job" data-job="order">
        <label class="drop">
          <span class="label">웰스토리 원본 파일</span>
          <span class="name">여기에 끌어다 놓거나 눌러서 선택하세요 (.xlsx)</span>
          <input type="file" name="src" accept=".xlsx" required>
        </label>
        <button type="submit" class="primary">변환 실행</button>
      </form>
      <div class="result"></div>
    </section>
    <section id="settlement">
      <h2>결산서</h2>
      <p class="muted">ESP 기간별구매현황(계약, 비계약)을 올리면 붙여넣기용 파일과 결산자료 4개를 만듭니다.</p>
      <form class="job" data-job="settlement">
        <div class="drops">
          <label class="drop">
            <span class="label">계약 원본</span>
            <span class="name">계약.xls</span>
            <input type="file" name="contract" accept=".xls,.xlsx,.html,.htm" required>
          </label>
          <label class="drop">
            <span class="label">비계약 원본</span>
            <span class="name">비계약.xls</span>
            <input type="file" name="noncontract" accept=".xls,.xlsx,.html,.htm" required>
          </label>
        </div>
        <label class="drop optional">
          <span class="label">결산자료 양식 (선택, 4개)</span>
          <span class="name">비워 두면 보관된 양식을 씁니다. 양식을 바꿀 때만 4개를 함께 올리세요</span>
          <input type="file" name="templates" accept=".xlsx" multiple>
        </label>
        <p class="template-info muted" data-template="settlement"></p>
        <button type="submit" class="primary">변환 실행</button>
      </form>
      <div class="result"></div>
    </section>
    <section id="expendables">
      <h2>소모품 결산</h2>
      <p class="muted">ESP 현재고현황(창고별)을 올리면 창고별 소모품 결산 파일을 만듭니다.</p>
      <form class="job" data-job="expendables">
        <label class="drop">
          <span class="label">현재고현황(창고별) 원본</span>
          <span class="name">여기에 끌어다 놓거나 눌러서 선택하세요 (.xls)</span>
          <input type="file" name="src" accept=".xls,.xlsx,.html,.htm" required>
        </label>
        <label class="drop optional">
          <span class="label">소모품 결산 양식 (선택)</span>
          <span class="name">비워 두면 보관된 양식을 씁니다. 처음이거나 양식을 바꿀 때만 올리세요</span>
          <input type="file" name="template" accept=".xlsx">
        </label>
        <p class="template-info muted" data-template="expendables"></p>
        <button type="submit" class="primary">변환 실행</button>
      </form>
      <div class="result"></div>
    </section>
    <section id="vendors">
      <h2>거래처별 변환</h2>
      <p class="muted">ESP 기간별구매현황을 올리면 웰스토리를 뺀 거래처별 시트와 품목별 요약표를 만듭니다.</p>
      <form class="job" data-job="vendors">
        <label class="drop">
          <span class="label">기간별구매현황 원본</span>
          <span class="name">여기에 끌어다 놓거나 눌러서 선택하세요 (.xls)</span>
          <input type="file" name="src" accept=".xls,.xlsx,.html,.htm" required>
        </label>
        <button type="submit" class="primary">변환 실행</button>
      </form>
      <div class="result"></div>
    </section>
    <section id="settings">
      <h2>설정</h2>
      <p class="muted">준비 중입니다.</p>
    </section>

    <div id="status" class="muted">서버 연결 확인 중...</div>
  </main>

  <script>
    // 탭 전환: 누른 버튼과 같은 id의 section만 보이게
    document.querySelectorAll("nav button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("nav button").forEach(function (b) { b.classList.remove("active"); });
        document.querySelectorAll("section").forEach(function (s) { s.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    // 서버 상태 확인: /api/status 를 불러서 결과를 아래에 표시
    fetch("/api/status")
      .then(function (res) { return res.json(); })
      .then(function (s) {
        var el = document.getElementById("status");
        if (s.configErr) {
          el.className = "error";
          el.textContent = "설정 파일 오류: " + s.configErr;
        } else {
          el.className = "ok";
          el.textContent = "서버 연결됨 · 작업 폴더: " + s.appDir;
        }
      })
      .catch(function () {
        var el = document.getElementById("status");
        el.className = "error";
        el.textContent = "서버에 연결할 수 없습니다. 프로그램이 실행 중인지 확인하세요.";
      });

    // el(태그, 글자): 화면에 넣을 요소를 만듦. 글자는 textContent로 넣어서 HTML로 해석되지 않게 함
    function el(tag, text, className) {
      var e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (className) e.className = className;
      return e;
    }

    // 파일 놓는 곳: 파일을 고르면 이름을 보여 주고, 끌어다 놓는 동안 색을 바꿈
    document.querySelectorAll(".drop").forEach(function (drop) {
      var input = drop.querySelector("input[type=file]");
      var name = drop.querySelector(".name");
      var hint = name.textContent;
      input.addEventListener("change", function () {
        var chosen = input.files.length > 0;
        var names = Array.from(input.files).map(function (f) { return f.name; });
        name.textContent = chosen ? names.join(", ") : hint;
        drop.classList.toggle("chosen", chosen);
      });
      input.addEventListener("dragenter", function () { drop.classList.add("dragover"); });
      input.addEventListener("dragleave", function () { drop.classList.remove("dragover"); });
      input.addEventListener("drop", function () { drop.classList.remove("dragover"); });
    });

    // 보관된 양식 표시: /api/templates 를 불러서 결산서·소모품 탭에 표시
    function loadTemplates() {
      fetch("/api/templates")
        .then(function (res) { return res.json(); })
        .then(function (t) {
          document.querySelectorAll(".template-info").forEach(function (p) {
            var info = t[p.dataset.template];
            if (!info || !info.files || info.files.length === 0) {
              p.className = "template-info error";
              p.textContent = "보관된 양식이 없습니다. 처음 한 번은 양식을 같이 올려 주세요.";
              return;
            }
            p.className = "template-info muted";
            p.textContent = "보관된 양식 (" + info.modified + "): " + info.files.join(", ");
          });
        });
    }
    loadTemplates();

    // showResult: 서버가 돌려준 실행 결과를 화면에 그림
    function showResult(box, data) {
      box.replaceChildren();
      if (!data.ok) {
        var fail = el("div", "", "box fail");
        fail.append(el("strong", "실행 실패"), el("div", data.error));
        box.append(fail);
        return;
      }
      if (data.warnings && data.warnings.length > 0) {
        var warn = el("div", "", "box warn");
        warn.append(el("strong", "확인이 필요합니다"));
        var ul = el("ul");
        data.warnings.forEach(function (w) { ul.append(el("li", w)); });
        warn.append(ul);
        box.append(warn);
      }
      box.append(el("pre", (data.lines || []).join("\n")));

      var folder = el("div", "", "folder");
      var open = el("button", "결과 폴더 열기", "secondary");
      open.type = "button";
      open.addEventListener("click", function () {
        fetch("/api/open", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: data.outDir })
        })
          .then(function (res) { return res.json(); })
          .then(function (r) { if (r.error) alert(r.error); });
      });
      folder.append(open, el("span", data.outDir));
      box.append(folder);
    }

    // 기능 실행: form.job 을 제출하면 /api/run/<data-job> 으로 파일을 보내고 결과를 표시
    document.querySelectorAll("form.job").forEach(function (form) {
      var box = form.parentElement.querySelector(".result");
      var submit = form.querySelector("button[type=submit]");
      form.addEventListener("submit", function (e) {
        e.preventDefault(); // 페이지가 새로 고쳐지지 않게
        submit.disabled = true;
        submit.textContent = "변환 중...";
        box.replaceChildren(el("p", "변환하고 있습니다. 잠시 기다려 주세요.", "muted"));

        fetch("/api/run/" + form.dataset.job, { method: "POST", body: new FormData(form) })
          .then(function (res) { return res.json(); })
          .then(function (data) { showResult(box, data); })
          .catch(function (err) { showResult(box, { ok: false, error: "서버와 통신하지 못했습니다: " + err }); })
          .finally(function () {
            submit.disabled = false;
            submit.textContent = "변환 실행";
            loadTemplates(); // 양식이 새로 보관됐을 수 있으니 다시 표시
          });
      });
    });
  </script>
</body>

</html>
