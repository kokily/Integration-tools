<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>통합 업무 도구</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #d9dde3;
      --accent: #2563eb;
      --ok: #15803d;
      --warn: #b45309;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 15px;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav button {
      border: 1px solid var(--line);
      border-bottom: none;
      background: var(--bg);
      padding: 8px 18px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      color: var(--muted);
    }

    nav button.active {
      background: var(--panel);
      color: var(--text);
      font-weight: bold;
      position: relative;
      top: 1px;
    }

    main {
      padding: 24px;
      max-width: 960px;
    }

    section {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }

    section.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .muted {
      color: var(--muted);
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
    }

    .ok {
      color: var(--ok);
    }

    .error {
      color: var(--error);
    }
  </style>
</head>

<body>
  <header>
    <h1>통합 업무 도구</h1>
    <nav>
      <button data-tab="order" class="active">발주서</button>
      <button data-tab="settlement">결산서</button>
      <button data-tab="expendables">소모품</button>
      <button data-tab="vendors">거래처별</button>
      <button data-tab="settings">설정</button>
    </nav>
  </header>

  <main>
    <section id="order" class="active">
      <h2>웰스토리 발주서</h2>
      <p class="muted">준비 중입니다. (3단계에서 연결)</p>
    </section>
    <section id="settlement">
      <h2>결산서</h2>
      <p class="muted">준비 중입니다.</p>
    </section>
    <section id="expendables">
      <h2>소모품 결산</h2>
      <p class="muted">준비 중입니다.</p>
    </section>
    <section id="vendors">
      <h2>거래처별 변환</h2>
      <p class="muted">준비 중입니다.</p>
    </section>
    <section id="settings">
      <h2>설정</h2>
      <p class="muted">준비 중입니다.</p>
    </section>

    <div id="status" class="muted">서버 연결 확인 중...</div>
  </main>

  <script>
    // 탭 전환: 누른 버튼과 같은 id의 section만 보이게
    document.querySelectorAll("nav button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("nav button").forEach(function (b) { b.classList.remove("active"); });
        document.querySelectorAll("section").forEach(function (s) { s.classList.remove("active"); });
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    // 서버 상태 확인: /api/status 를 불러서 결과를 아래에 표시
    fetch("/api/status")
      .then(function (res) { return res.json(); })
      .then(function (s) {
        var el = document.getElementById("status");
        if (s.configErr) {
          el.className = "error";
          el.textContent = "설정 파일 오류: " + s.configErr;
        } else {
          el.className = "ok";
          el.textContent = "서버 연결됨 · 작업 폴더: " + s.appDir;
        }
      })
      .catch(function () {
        var el = document.getElementById("status");
        el.className = "error";
        el.textContent = "서버에 연결할 수 없습니다. 프로그램이 실행 중인지 확인하세요.";
      });
  </script>
</body>

</html>
